[project]
name = "sourcelens"
version = "0.1.0"
description = "Agent-led, evidence-backed business investigation workspace"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "google-cloud-bigquery>=3.35.0",
  "google-cloud-storage>=3.2.0",
  "httpx>=0.28.0",
  "openai-agents>=0.6.0",
  "openpyxl>=3.1.5",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "pypdf>=6.0.0",
  "python-docx>=1.2.0",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "qdrant-client>=1.15.0",
  "sqlglot>=27.0.0",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "ruff>=0.12.0",
]

[project.scripts]
sourcelens-api = "sourcelens.main:run"
sourcelens-reference-data = "sourcelens.reference_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcelens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
